name: Show your setup
description: Share a working Codex WebApp setup or a friendly setup note.
title: "[Setup]: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your setup.

        Please redact before posting. Do not include tokens, cookies, session IDs, private repository contents, customer data, private prompts, internal URLs, `.env` values, or screenshots that expose sensitive work.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: "I reviewed this issue and removed tokens, cookies, session IDs, private repository contents, customer data, private prompts, internal URLs, `.env` values, and sensitive screenshots."
          required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: codex --version
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks that passed
      options:
        - label: "`npx -y codex-webapp@latest doctor`"
        - label: "`npx -y codex-webapp@latest start --dry-run`"
        - label: "`npx -y codex-webapp@latest start`"
        - label: "`npx -y codex-webapp@latest smoke --url http://127.0.0.1:8214/`"
  - type: dropdown
    id: access
    attributes:
      label: Access boundary
      description: Select the closest match. Do not post private tunnel URLs or secrets.
      options:
        - Localhost only
        - Tailscale
        - Cloudflare Access
        - WireGuard
        - SSH tunnel
        - Other trusted boundary
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Setup notes
      description: What worked, what was confusing, or what docs would have helped?
      placeholder: Keep it short. Redact anything private.
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or demo link
      description: Optional. Only attach reviewed screenshots or links that do not expose private work.
    validations:
      required: false

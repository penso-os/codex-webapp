name: Bug report
description: Report an install, doctor, start, or smoke-test failure.
title: "[Bug]: "
labels: ["bug", "support"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, cookies, session IDs, private repository names, private URLs, customer data, or screenshots that expose sensitive work.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.4, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: codex --version
    validations:
      required: true
  - type: dropdown
    id: failed_step
    attributes:
      label: First failed step
      options:
        - Codex install/update
        - codex remote-control --help
        - doctor
        - start --dry-run
        - start
        - smoke
        - browser/mobile access
        - other
    validations:
      required: true
  - type: textarea
    id: redacted_output
    attributes:
      label: Redacted output
      description: Paste only redacted output from doctor/start/smoke.
      render: shell
    validations:
      required: true

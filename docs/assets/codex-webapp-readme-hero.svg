<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex WebApp README hero</title>
  <desc id="desc">README hero showing Codex WebApp as an unofficial local companion UI with localhost start and trusted remote access boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f5ef"/>
      <stop offset="100%" stop-color="#e9efe9"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#202523"/>
      <stop offset="100%" stop-color="#111312"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="#111312"/>
  <rect x="42" y="38" width="1196" height="344" rx="30" fill="url(#bg)"/>
  <g transform="translate(88 86)">
    <text x="0" y="42" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="850" fill="#141615">Codex WebApp</text>
    <text x="0" y="92" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2f7a5b">Watch Codex work from another screen.</text>
    <text x="0" y="132" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700" fill="#2f7a5b">Keep the project on your computer.</text>
    <rect x="0" y="170" width="438" height="54" rx="27" fill="#141615"/>
    <text x="28" y="205" font-family="SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700" fill="#f4f4f4">npx -y codex-webapp start</text>
    <text x="0" y="264" font-family="Inter, Arial, sans-serif" font-size="18" fill="#525a54">Unofficial local companion UI. Not affiliated with or endorsed by OpenAI.</text>
  </g>
  <g transform="translate(690 82)" filter="url(#shadow)">
    <rect width="324" height="232" rx="22" fill="#ffffff" stroke="#d3d0c7"/>
    <rect x="24" y="24" width="276" height="160" rx="16" fill="url(#screen)"/>
    <rect x="48" y="52" width="228" height="14" rx="7" fill="#3d4240"/>
    <text x="58" y="112" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#f4f4f4">What should</text>
    <text x="58" y="150" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#f4f4f4">we build?</text>
    <rect x="52" y="202" width="220" height="10" rx="5" fill="#d7d2c8"/>
  </g>
  <g transform="translate(1034 116)" filter="url(#shadow)">
    <rect width="132" height="220" rx="30" fill="#ffffff" stroke="#d3d0c7"/>
    <rect x="14" y="18" width="104" height="184" rx="22" fill="#141615"/>
    <rect x="38" y="42" width="56" height="8" rx="4" fill="#3d4240"/>
    <rect x="34" y="100" width="64" height="12" rx="6" fill="#f4f4f4"/>
    <rect x="34" y="128" width="48" height="12" rx="6" fill="#8fd6aa"/>
  </g>
  <path d="M1020 216 H1036" stroke="#2f7a5b" stroke-width="8" stroke-linecap="round"/>
  <path d="M1028 200 L1046 216 L1028 232" fill="none" stroke="#2f7a5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="690" y="330" width="476" height="34" rx="17" fill="#2f7a5b"/>
  <text x="720" y="353" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">localhost first; use a trusted boundary for phone access</text>
</svg>
